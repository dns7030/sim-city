<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sprite sheet</title>
<style>
  body { margin: 0; background: #2b2f36; color: #ddd; font: 14px sans-serif; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="sprites/engine.js"></script>
<script src="sprites/set1.js"></script>
<script src="sprites/set2.js"></script>
<script src="sprites/set3.js"></script>
<script src="sprites/set4.js"></script>
<script src="sprites/set5.js"></script>
<script src="sprites/set6.js"></script>
<script>
const canvas = document.getElementById('c');
const COLS = 4, CW = 320, CH = 400;
canvas.width = COLS * CW;
canvas.height = Math.ceil(sprites.length / COLS) * CH + 20;
initCtx(canvas.getContext('2d'));
ctx.fillStyle = '#2b2f36'; ctx.fillRect(0, 0, canvas.width, canvas.height);
sprites.forEach((s, i) => {
  const col = i % COLS, row = Math.floor(i / COLS);
  const cx = col * CW + CW / 2, cy = row * CH + 30;
  ctx.save();
  OX = cx - (s.w - s.d) * HW / 2; OY = cy + 250 - (s.w + s.d) * HH;
  ground(s.w, s.d, s.ground || '#6f8a5a');
  s.draw();
  ctx.restore();
  ctx.fillStyle = '#ddd'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s.name, cx, cy + 300);
});
</script>
</body>
</html>
